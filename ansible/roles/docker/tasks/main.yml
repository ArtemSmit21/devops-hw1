---
- name: Зависимости для репозитория Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: GPG-ключ репозитория Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Репозиторий Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Установить Docker Engine и Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Автозапуск Docker и запуск сервиса
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: deployer в группе docker (Docker без sudo)
  ansible.builtin.user:
    name: deployer
    groups: docker
    append: true
