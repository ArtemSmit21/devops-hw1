services:
  app:
    image: nginx:1.27-alpine
    container_name: app
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

networks:
  app_net:
    name: app_net
